<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Einstellungen – Anwesenheitsliste</title>
  <style>
    body { font-family:Arial,sans-serif; padding:20px; }
    label { display:block; margin:10px 0 4px; font-weight:bold; }
    input, select { width:100%; padding:6px; font-size:1em; box-sizing:border-box; }
    button { margin-top:20px; padding:8px 12px; font-size:1em; }
  </style>
  <script>
    function saveSettings(){
      // Werte einlesen
      const settings = {
        defaultStart: document.getElementById('defaultStart').value,
        defaultEnd:   document.getElementById('defaultEnd').value,
        children:     document.getElementById('children').value.split(',').map(s=>s.trim()).filter(s=>s),
        caregiver:    document.getElementById('caregiver').value.trim(),
        pauschaleM:   parseFloat(document.getElementById('pauschaleM').value) || 0
      };
      localStorage.setItem('anwSettings', JSON.stringify(settings));
      // Weiterleitung zur Hauptseite
      window.location.href = 'anwesenheitsliste.html';
    }
    // Wenn schon Settings existieren, direkt weiter
    window.addEventListener('DOMContentLoaded', ()=>{
      const raw = localStorage.getItem('anwSettings');
      if(raw){
        window.location.href = 'anwesenheitsliste.html';
        return;
      }
      // Default-Werte setzen
      document.getElementById('defaultStart').value = '07:30';
      document.getElementById('defaultEnd').value   = '14:00';
      document.getElementById('children').value     = 'Marlon,Stella,Jelle,Nilas,Emilia';
      document.getElementById('caregiver').value    = 'Sabrina';
      document.getElementById('pauschaleM').value   = '4.50';
    });
  </script>
</head>
<body>
  <h1>Einstellungen</h1>

  <label for="defaultStart">Standard „von“</label>
  <input type="time" id="defaultStart">

  <label for="defaultEnd">Standard „bis“</label>
  <input type="time" id="defaultEnd">

  <label for="children">Kinder (Komma-getrennt)</label>
  <input type="text" id="children">

  <label for="caregiver">Kindertagespflegeperson</label>
  <input type="text" id="caregiver">

  <label for="pauschaleM">Pauschale pro Mittagessen (€)</label>
  <input type="number" id="pauschaleM" step="0.01" min="0">

  <button onclick="saveSettings()">Speichern & weiter</button>
</body>
</html>
